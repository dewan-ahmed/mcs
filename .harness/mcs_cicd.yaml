# MCS CI/CD (net8) — combined pipeline, Phase 1/3 POC for github.com/dewan-ahmed/mcs
#
# Replaces .harness/mcs_ci.yaml + .harness/mcs_cd.yaml with a single pipeline.
# One pipeline means <+pipeline.sequenceId> is identical in the CI stage and the
# deploy stage, so the image tag and chart version produced by CI are the exact
# ones CD consumes — no parameter passing, no drift.
#
# PREREQUISITES (see notes at the bottom of this file):
#   1. chartVersion must be <+input> on all three services.
#   2. The artifact-source and manifest identifiers below must match the real
#      identifiers on each service (created in the UI, so they are placeholders here).
#
# Triggers are deliberately omitted — manual runs for now.

pipeline:
  name: MCS CICD dv1
  identifier: mcs_cicd
  projectIdentifier: loandepotmcs
  orgIdentifier: default
  tags:
    phase: "3"
    poc: "true"

  variables:
    - name: acr_login_server
      type: String
      value: "mcspocacr.azurecr.io"

  properties:
    ci:
      codebase:
        connectorRef: mcs_github
        repoName: dewan-ahmed/mcs
        build: <+input>

  stages:
    # ------------------------------------------------------------------
    # STAGE 1 — CI: build, unit test, publish, 3 images, 3 OCI Helm charts
    # ------------------------------------------------------------------
    - stage:
        name: Build and Push
        identifier: build_and_push
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              # Unit tests only — Notify.IntegrationTests needs a live endpoint, runs post-deploy instead.
              - step:
                  type: Run
                  name: Restore Build Test
                  identifier: restore_build_test
                  spec:
                    connectorRef: mcs_mcr_public
                    image: mcr.microsoft.com/dotnet/sdk:8.0
                    shell: Sh
                    command: |-
                      set -e
                      cd src
                      dotnet restore NotifyService.sln
                      dotnet build NotifyService.sln -c Release --no-restore
                      dotnet test tests/Notify.UnitTests/Notify.UnitTests.csproj \
                        -c Release --no-build \
                        --logger "trx;LogFileName=unit-results.trx" \
                        --results-directory /harness/test-results
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - src/tests/**/unit-results.trx

              - step:
                  type: Run
                  name: Publish Workloads
                  identifier: publish_workloads
                  spec:
                    connectorRef: mcs_mcr_public
                    image: mcr.microsoft.com/dotnet/sdk:8.0
                    shell: Sh
                    command: |-
                      set -e
                      cd src
                      dotnet publish Notify.Core.Api/Notify.Core.Api.csproj -c Release -o /harness/publish/core --no-restore
                      dotnet publish Notify.Public.Api/Notify.Public.Api.csproj -c Release -o /harness/publish/public --no-restore
                      dotnet publish Notify.Worker/Notify.Worker.csproj -c Release -o /harness/publish/worker --no-restore

              # Kaniko build — context is the publish/ output dir, not the source folder.
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Core
                  identifier: build_push_core
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-core-api
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Core.Api/Dockerfile
                    context: /harness/publish/core

              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Public
                  identifier: build_push_public
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-public-api
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Public.Api/Dockerfile
                    context: /harness/publish/public

              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Worker
                  identifier: build_push_worker
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-worker
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Worker/Dockerfile
                    context: /harness/publish/worker

              # helm package + OCI push for all 3 charts — one login covers all three pushes.
              - step:
                  type: Run
                  name: Package and Push Helm Charts
                  identifier: package_push_helm
                  spec:
                    connectorRef: mcs_dockerhub_public
                    image: alpine/helm:3.14.0
                    shell: Sh
                    envVariables:
                      ACR_USER: <+secrets.getValue("mcs_acr_username")>
                      ACR_PASS: <+secrets.getValue("mcs_acr_password")>
                    command: |-
                      set -e
                      echo "$ACR_PASS" | helm registry login <+pipeline.variables.acr_login_server> \
                        --username "$ACR_USER" --password-stdin
                      mkdir -p /harness/helm-out
                      for chart in notify-core-api notify-public-api notify-worker; do
                        helm package charts/$chart \
                          --version 0.1.<+pipeline.sequenceId> \
                          --app-version <+codebase.commitSha> \
                          -d /harness/helm-out
                        helm push /harness/helm-out/${chart}-0.1.<+pipeline.sequenceId>.tgz \
                          oci://<+pipeline.variables.acr_login_server>/helm
                      done

          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: mcs_k8s_dv1
              namespace: harness-build
              automountServiceAccountToken: true

    # ------------------------------------------------------------------
    # STAGE 2 — CD: NativeHelm deploy of all three services into dv1
    # Image tag and chart version are taken from THIS pipeline's sequenceId,
    # which is the same value the CI stage above just published under.
    # ------------------------------------------------------------------
    - stage:
        name: Deploy dv1
        identifier: deploy_dv1
        type: Deployment
        spec:
          deploymentType: NativeHelm
          services:
            values:
              - serviceRef: mcs_core_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: core_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: core_docker_artifact
                          sources:
                            - identifier: core_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>

              - serviceRef: mcs_public_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: public_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: public_docker_artifact
                          sources:
                            - identifier: public_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>

              - serviceRef: mcs_textmessage_worker
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: worker_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: worker_docker_artifact
                          sources:
                            - identifier: worker_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
            metadata:
              parallel: true
          environment:
            environmentRef: dv1
            deployToAll: false
            infrastructureDefinitions:
              - identifier: dv1_infra
          execution:
            steps:
              - step:
                  name: Helm Deploy
                  identifier: helm_deploy
                  type: HelmDeploy
                  timeout: 15m
                  spec:
                    skipDryRun: false
                    ignoreReleaseHistFailStatus: false
                    useUpgradeInstall: true
            rollbackSteps:
              - step:
                  name: Helm Rollback
                  identifier: helm_rollback
                  type: HelmRollback
                  timeout: 10m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback

# ------------------------------------------------------------------
# NOTES
#
# 1. chartVersion as <+input>
#    Each of the three services must have chartVersion: <+input> in its manifest
#    definition, or the manifests block above will fail schema validation
#    ("field is not a runtime input"). Flip it in Services -> <service> -> Manifest.
#    Without this the deploy stage silently installs a pinned chart version and
#    the CI chart push has no effect on what actually runs.
#
# 2. Identifiers — CONFIRMED against the three services:
#      mcs_core_service        core_helm_chart   / core_docker_artifact   (mcs/notify-core-api)
#      mcs_public_service      public_helm_chart / public_docker_artifact (mcs/notify-public-api)
#      mcs_textmessage_worker  worker_helm_chart / worker_docker_artifact (mcs/notify-worker)
#    All three manifests use store mcs_acr_helm with Associated Values YAML
#    File = values-dv1.yaml, and all three artifacts use connector mcs_acr.
#
# 3. Image tag flows through values-dv1.yaml
#    charts/notify-*/values-dv1.yaml pins image.tag to <+artifact.tag>, which now
#    resolves to <+pipeline.sequenceId> via the artifact source. No change needed
#    there. The chart .tgz must have been built by a CI run that already contained
#    values-dv1.yaml — true for anything from the CD blocker #3 fix onward. 
#
# 4. Approval gate
#    When qa1 lands, insert an Approval stage between deploy_dv1 and deploy_qa1.
#    Note for the client report: with a combined pipeline, whoever runs it is the
#    pipeline executor, so disallowPipelineExecutor: true will block that same
#    person from approving their own promotion — which is the intended behaviour
#    per the plan, but worth demonstrating deliberately rather than discovering.
# ------------------------------------------------------------------
