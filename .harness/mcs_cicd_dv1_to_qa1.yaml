pipeline:
  projectIdentifier: loandepotmcs
  orgIdentifier: default
  tags:
    phase: "3"
    poc: "true"
  variables:
    - name: acr_login_server
      type: String
      value: mcspocacr.azurecr.io
  properties:
    ci:
      codebase:
        connectorRef: mcs_github
        repoName: dewan-ahmed/mcs
        build: <+input>
  stages:
    - stage:
        name: Build and Push
        identifier: build_and_push
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Restore Build Test
                  identifier: restore_build_test
                  spec:
                    connectorRef: mcs_mcr_public
                    image: mcr.microsoft.com/dotnet/sdk:8.0
                    shell: Sh
                    command: |-
                      set -e
                      cd src
                      dotnet restore NotifyService.sln
                      dotnet build NotifyService.sln -c Release --no-restore
                      dotnet test tests/Notify.UnitTests/Notify.UnitTests.csproj \
                        -c Release --no-build \
                        --logger "trx;LogFileName=unit-results.trx" \
                        --results-directory /harness/test-results
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - src/tests/**/unit-results.trx
              - step:
                  type: Run
                  name: Publish Workloads
                  identifier: publish_workloads
                  spec:
                    connectorRef: mcs_mcr_public
                    image: mcr.microsoft.com/dotnet/sdk:8.0
                    shell: Sh
                    command: |-
                      set -e
                      cd src
                      dotnet publish Notify.Core.Api/Notify.Core.Api.csproj -c Release -o /harness/publish/core --no-restore
                      dotnet publish Notify.Public.Api/Notify.Public.Api.csproj -c Release -o /harness/publish/public --no-restore
                      dotnet publish Notify.Worker/Notify.Worker.csproj -c Release -o /harness/publish/worker --no-restore
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Core
                  identifier: build_push_core
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-core-api
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Core.Api/Dockerfile
                    context: /harness/publish/core
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Public
                  identifier: build_push_public
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-public-api
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Public.Api/Dockerfile
                    context: /harness/publish/public
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Worker
                  identifier: build_push_worker
                  spec:
                    connectorRef: mcs_acr
                    repo: <+pipeline.variables.acr_login_server>/mcs/notify-worker
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: src/Notify.Worker/Dockerfile
                    context: /harness/publish/worker
              - step:
                  type: Run
                  name: Package and Push Helm Charts
                  identifier: package_push_helm
                  spec:
                    connectorRef: mcs_dockerhub_public
                    image: alpine/helm:3.14.0
                    shell: Sh
                    envVariables:
                      ACR_USER: <+secrets.getValue("mcs_acr_username")>
                      ACR_PASS: <+secrets.getValue("mcs_acr_password")>
                    command: |-
                      set -e
                      echo "$ACR_PASS" | helm registry login <+pipeline.variables.acr_login_server> \
                        --username "$ACR_USER" --password-stdin
                      mkdir -p /harness/helm-out
                      for chart in notify-core-api notify-public-api notify-worker; do
                        helm package charts/$chart \
                          --version 0.1.<+pipeline.sequenceId> \
                          --app-version <+codebase.commitSha> \
                          -d /harness/helm-out
                        helm push /harness/helm-out/${chart}-0.1.<+pipeline.sequenceId>.tgz \
                          oci://<+pipeline.variables.acr_login_server>/helm
                      done
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: mcs_k8s_dv1
              namespace: harness-build
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
    - stage:
        name: Deploy dv1
        identifier: deploy_dv1
        type: Deployment
        spec:
          deploymentType: NativeHelm
          services:
            values:
              - serviceRef: mcs_core_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: core_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: core_docker_artifact
                          sources:
                            - identifier: core_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
              - serviceRef: mcs_public_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: public_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: public_docker_artifact
                          sources:
                            - identifier: public_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
              - serviceRef: mcs_textmessage_worker
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: worker_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: worker_docker_artifact
                          sources:
                            - identifier: worker_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
            metadata:
              parallel: true
          environment:
            environmentRef: dv1
            deployToAll: false
            infrastructureDefinitions:
              - identifier: dv1_infra
          execution:
            steps:
              - step:
                  name: Helm Deploy
                  identifier: helm_deploy
                  type: HelmDeploy
                  timeout: 15m
                  spec:
                    skipDryRun: false
                    ignoreReleaseHistFailStatus: false
                    useUpgradeInstall: true
            rollbackSteps:
              - step:
                  name: Helm Rollback
                  identifier: helm_rollback
                  type: HelmRollback
                  timeout: 10m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Approve QA1
        identifier: approve_qa1
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve QA1
                  identifier: qa1_gate
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: Approve promotion of MCS to QA1. Verify dv1 is healthy first.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - mcs_qa_approvers
                      minimumCount: 1
                      disallowPipelineExecutor: true
                    approverInputs: []
    - stage:
        name: Deploy qa1
        identifier: deploy_qa1
        type: Deployment
        spec:
          deploymentType: NativeHelm
          services:
            values:
              - serviceRef: mcs_core_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: core_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: core_docker_artifact
                          sources:
                            - identifier: core_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
              - serviceRef: mcs_public_service
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: public_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: public_docker_artifact
                          sources:
                            - identifier: public_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
              - serviceRef: mcs_textmessage_worker
                serviceInputs:
                  serviceDefinition:
                    type: NativeHelm
                    spec:
                      manifests:
                        - manifest:
                            identifier: worker_helm_chart
                            type: HelmChart
                            spec:
                              chartVersion: 0.1.<+pipeline.sequenceId>
                      artifacts:
                        primary:
                          primaryArtifactRef: worker_docker_artifact
                          sources:
                            - identifier: worker_docker_artifact
                              type: DockerRegistry
                              spec:
                                tag: <+pipeline.sequenceId>
            metadata:
              parallel: true
          environment:
            environmentRef: qa1
            deployToAll: false
            infrastructureDefinitions:
              - identifier: qa1_infra
          execution:
            steps:
              - step:
                  name: Helm Deploy
                  identifier: helm_deploy
                  type: HelmDeploy
                  timeout: 15m
                  spec:
                    skipDryRun: false
                    ignoreReleaseHistFailStatus: false
                    useUpgradeInstall: true
            rollbackSteps:
              - step:
                  name: Helm Rollback
                  identifier: helm_rollback
                  type: HelmRollback
                  timeout: 10m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  identifier: MCS_CICD_dv1_to_qa1
  name: MCS CICD dv1 to qa1
